# Job de ejemplo - ejecuta un notebook en el ambiente correspondiente
# Las variables ${var.catalog} y ${var.schema} se resuelven según el target (dev o prod)

resources:
  jobs:
    example_job:
      name: example_job
      tasks:
        - task_key: main_task
          notebook_task:
            notebook_path: ../src/notebooks/example_notebook.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/Bogota