resources:
  jobs:
    example_job:
      name: example_job
      tasks:
        - task_key: main_task
          notebook_task:
            notebook_path: ../src/notebooks/example_notebook.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          job_cluster_key: main_cluster
      job_clusters:
        - job_cluster_key: main_cluster
          serverless: true
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/Bogota